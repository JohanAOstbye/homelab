name: cluster-agent
namespace: cluster-agent
source:
  # AI agent that maintains the cluster: daily mail report, Telegram chat, alert triage.
  repository: https://github.com/JohanAOstbye/cluster-agent.git
  revision: main
  path: charts/cluster-agent
  values:
    image:
      tag: sha-e95821c
    # Cluster RBAC is installed by the platform (halvnais apps/cluster-agent-rbac.yaml).
    rbac:
      scope: workload
    imagePullSecrets:
      - name: core-github-creds
    clusterName: homelab
    observability:
      prometheusUrl: http://core-monitoring-kube-prome-prometheus.core-monitoring:9090
      lokiUrl: http://loki.core-monitoring:3100
      alertmanagerUrl: http://core-monitoring-kube-prome-alertmanager.core-monitoring:9093
    gitea:
      url: http://gitea-http.core-gitea:3000
      notesRepo: johanaostbye/ops-notes
    github:
      infraRepo: JohanAOstbye/homelab
    mail:
      from: johan@ostbye.dev
      to: johan@ostbye.dev
    # Secret values live in OpenBao under the keys in the chart's externalSecret.keys.
    externalSecret:
      enabled: true
      property: value
    protectedNamespaces:
      - devbox
